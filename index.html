    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && desc.get && !desc.set && desc.configurable) {
            var currentFetch = desc.get;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: desc.enumerable,
              get: function () {
                return currentFetch.call(window);
              },
              set: function () {},
            });
          }
        } catch (e) {}
        window.addEventListener(
          'error',
          function (event) {
            try {
              var msg = String((event && event.message) || '');
              var src = String((event && event.filename) || '');
              if (
                src.indexOf('chrome-extension://') === 0 &&
                msg.indexOf('fetch') !== -1
              ) {
                event.preventDefault();
                event.stopImmediatePropagation();
              }
            } catch (e) {}
          },
          true
        );
      })();
    </script>
